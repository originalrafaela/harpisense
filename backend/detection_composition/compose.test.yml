services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: composition_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: detection_composition_test
    tmpfs:
      - /var/lib/postgresql
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U composition_test -d detection_composition_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    image: harpisense-detection:integration
    working_dir: /work
    volumes:
      - ../..:/work
    environment:
      DATABASE_URL: postgresql://composition_test:isolated-test-only@db/detection_composition_test
      PYTHONPATH: /work/backend/domain:/work/backend:/work/backend/p08_p09/adaptador_logs_p08_p09:/work/p08_captura/integracao:/work/genai
    command: [python, -B, backend/detection_composition/tests/run_suite.py]
    depends_on:
      db:
        condition: service_healthy
    networks: [test]
networks:
  test:
    internal: true
