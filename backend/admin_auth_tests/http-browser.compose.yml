# Disposable loopback fixture only. No operational bootstrap or production DSN.
services:
  mfa-http:
    image: harpisense-admin-mfa-http:latest
    container_name: harpisense-admin-mfa-browser
    working_dir: /work
    command: [python, -m, admin_auth_ops.http_fixture, --private-dir, /private, --scenario, new]
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      PYTHONPATH: /work/backend:/work/backend/domain:/work/genai
      ADMIN_MFA_HTTP_TEST_DATABASE_URL: postgresql://auth_fixture:mfa-isolated-fixture-only@harpisense-admin-mfa-fixture:5432/mfa_http_fixture
      ADMIN_MFA_HTTP_CONTAINER: "1"
      ADMIN_MFA_HTTP_ORIGINS: '["http://127.0.0.1:5174","http://127.0.0.1:4174"]'
    volumes:
      - type: bind
        source: ../..
        target: /work
        read_only: true
      - mfa-private:/private
    networks:
      - isolated
volumes:
  mfa-private:
networks:
  isolated:
    external: true
    name: harpisense-mfa-isolated
