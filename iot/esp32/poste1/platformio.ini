[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@2.8
build_flags = -Wall -Wextra

; Same sources and libraries; local circuit only, never upload this environment.
[env:wokwi]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -include simulation/config.h
